<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Mintimals</title>

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/shop-pages.css">
</head>

<body class="entered-universe shop-page">

<header class="navbar">
  <div class="nav-container">
    <div class="logo">
      <img src="img/Mintimals-logo-white.png" alt="Mintimals Logo">
    </div>

    <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="collection.html">Collection</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>

<section class="collection-hero">
  <p class="eyebrow">Contact Us</p>

  <h1>Join The Mintiverse</h1>

  <p>
    Questions, collaborations, custom projects, or collector inquiries?
    We'd love to hear from you.
  </p>
</section>

<section class="contact-form-section">

  <div class="product-info-panel">

    <form class="contact-form">

      <input type="text" placeholder="Your Name">

      <input type="email" placeholder="Email Address">

      <input type="text" placeholder="Subject">

      <textarea placeholder="Tell us about your project..."></textarea>

      <button type="submit" class="cta-btn">
        Send Message
      </button>

    </form>

  </div>

</section>

</main>

<script src="js/script.js"></script>
</body>
</html>
